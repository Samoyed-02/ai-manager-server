services:
  postgres:
    # 테스트(TestcontainersConfiguration)·운영 DB와 같은 메이저 버전을 쓴다. 바꿀 때는 세 곳을 함께 맞춘다.
    # 메이저 버전을 바꾸면 기존 로컬 데이터를 읽지 못한다. 필요하면 pg_dump로 옮기고, 아니면 컨테이너와 볼륨을 지운 뒤 새로 띄운다.
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'